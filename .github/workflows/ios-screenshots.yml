# Captures d'écran iPhone 6,9" et iPad 13" pour App Store Connect, avec une playlist de démonstration (aucune donnée personnelle).
# Lancement manuel : Actions > « iOS (captures d'écran) » > Run workflow. Les PNG sont dans l'artefact « captures-ios ».
name: iOS (captures d'écran)

on:
  workflow_dispatch:
    inputs:
      m3u:
        description: "URL de la playlist M3U de démonstration"
        default: "https://raw.githubusercontent.com/jihemezes/kastideo/main/docs/store/demo.m3u"
      lang:
        description: "Langue des captures (fr ou en)"
        default: "fr"

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen et PyYAML
        run: |
          brew install xcodegen
          pip3 install --break-system-packages pyyaml || pip3 install pyyaml
      - name: Cache des paquets Swift (VLCKit)
        uses: actions/cache@v4
        with:
          path: ~/spm-cache
          key: spm-ios-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-
      - name: Projet avec cible de captures
        run: |
          python3 scripts/screenshots/make-project.py
          xcodegen generate --spec project-screens.yml
      - name: Captures
        env:
          LANGCODE: ${{ github.event.inputs.lang }}
          DEMO_M3U_URL: ${{ github.event.inputs.m3u }}
        run: |
          mkdir -p "$PWD/captures"
          udid() { xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          pat=sys.argv[1]; best=None
          for rt,devs in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in rt: continue
              for d in devs:
                  if re.search(pat,d['name']): best=d['udid']
          print(best or '')" "$1"; }
          IPHONE=$(udid 'iPhone .*Pro Max')
          IPAD=$(udid 'iPad Pro 13')
          echo "iPhone: $IPHONE / iPad: $IPAD"
          for pair in "iphone:$IPHONE" "ipad:$IPAD"; do
            name=${pair%%:*}; id=${pair#*:}
            [ -z "$id" ] && { echo "::warning::Aucun simulateur pour $name"; continue; }
            xcrun simctl boot "$id" || true
            export TEST_RUNNER_DEMO_M3U="$DEMO_M3U_URL"
            export TEST_RUNNER_SHOTS_DIR="$PWD/captures/$name"
            export TEST_RUNNER_SHOTS_LANG="$LANGCODE"
            export TEST_RUNNER_SHOTS_LOCALE=$([ "$LANGCODE" = en ] && echo en_US || echo fr_FR)
            xcodebuild test -project Kastideo.xcodeproj -scheme KastideoiOS -configuration Debug \
              -clonedSourcePackagesDirPath ~/spm-cache -destination "id=$id" \
              -only-testing:KastideoiOSUITests CODE_SIGNING_ALLOWED=NO > "test-$name.log" 2>&1 || {
                grep -n -i "error" "test-$name.log" | cut -c1-400 | head -60; echo "::warning::Tests $name en échec"; }
          done
          find captures -name '*.png' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: captures-ios
          path: captures
          retention-days: 14
