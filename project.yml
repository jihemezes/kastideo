# Définition du projet Xcode (générée par XcodeGen : `xcodegen generate`).
# Le fichier Kastideo.xcodeproj n'est pas versionné : il est recréé à partir de ce fichier.
name: Kastideo

options:
  bundleIdPrefix: fr.jmezes
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.17.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Laissé vide : renseigné par la CI (secret APPLE_TEAM_ID) ou par Xcode en local.
    DEVELOPMENT_TEAM: ""

packages:
  KastideoCore:
    path: Packages/KastideoCore
  # Moteur de lecture VLC (VLCKit 3.6, LGPL) : direct MPEG-TS, HLS, MKV, AVI…
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: "3.6.0"
  # Mises à jour automatiques (https://sparkle-project.org)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  Kastideo:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: docs/help/aide-fr.md
        buildPhase: resources
      - path: docs/help/aide-en.md
        buildPhase: resources
      - path: docs/help/img/help-home-en.png
        buildPhase: resources
      - path: docs/help/img/help-home-fr.png
        buildPhase: resources
      - path: docs/help/img/help-layout-en.png
        buildPhase: resources
      - path: docs/help/img/help-layout-fr.png
        buildPhase: resources
      - path: docs/help/img/help-takeout-en.png
        buildPhase: resources
      - path: docs/help/img/help-takeout-fr.png
        buildPhase: resources
      - path: docs/help/img/help-youtube-en.png
        buildPhase: resources
      - path: docs/help/img/help-youtube-fr.png
        buildPhase: resources
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: KastideoCore
      - package: Sparkle
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Kastideo
        CFBundleDisplayName: Kastideo
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Jean-Michel Ezes"
        # Les sources IPTV sont souvent en http:// : on autorise toutes les connexions.
        # Attention : ne pas ajouter NSAllowsArbitraryLoadsForMedia, sinon macOS ignore NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Recherche des serveurs Jellyfin, Emby et Plex de la maison (Réglages > Sources).
        NSLocalNetworkUsageDescription: "Kastideo recherche les serveurs Jellyfin, Emby et Plex de votre réseau, ainsi que les téléviseurs (Chromecast, Google TV) où diffuser la lecture."
        NSBonjourServices:
          - _googlecast._tcp
          - _airplay._tcp
        # Sparkle : flux des versions (branche « appcast » du dépôt public) et clé publique EdDSA.
        SUFeedURL: https://raw.githubusercontent.com/jihemezes/kastideo/appcast/appcast.xml
        SUPublicEDKey: PhRxsgR0m+ocj9knZzFOQUMTl36+TfzEZ1MyRKxgtPQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    entitlements:
      path: App/Kastideo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Relais de flux local (127.0.0.1) : Kastideo transmet au moteur VLC le flux qu'il reçoit du fournisseur.
        com.apple.security.network.server: true
        # Lecture des playlists choisies et écriture dans le dossier d'enregistrements choisi.
        com.apple.security.files.user-selected.read-write: true
        # Dossier par défaut des enregistrements : ~/Movies/Kastideo.
        com.apple.security.assets.movies.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle dans le bac à sable : accès au service d'installation.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - fr.jmezes.kastideo-spks
          - fr.jmezes.kastideo-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmezes.kastideo
        PRODUCT_NAME: Kastideo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          # Pas de « get-task-allow » en Release (exigé par la notarisation Apple).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme: {}

  # App iPhone / iPad (TestFlight) : interface SwiftUI propre à iOS (iOS/Sources) + logique partagée avec le Mac.
  KastideoiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/Sources
      - path: iOS/Resources
      - path: App/Sources
        includes:
          - LibraryStore.swift
          - Storage.swift
          - NavigationModel.swift
          - StartPage.swift
          - Replay.swift
          - WatchProgress.swift
          - PlaybackController.swift
          - PlaybackLog.swift
          - StreamRelay.swift
          - ReleaseNotes.swift
          - SharedSettings.swift
          - ConfigModels.swift
          - LegalText.swift
          - ThemeLabels.swift
          - YouTube.swift
          - MultiViewModel.swift
      - path: App/Resources
        includes:
          - fr.lproj/*
          - en.lproj/*
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: KastideoCore
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: iOS/Info.plist
      properties:
        CFBundleName: Kastideo
        CFBundleDisplayName: Kastideo
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "© 2026 Jean-Michel Ezes"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Le son continue écran verrouillé ou application en arrière-plan.
        UIBackgroundModes:
          - audio
        # Aucun chiffrement propre à l'application : évite la question « conformité à l'exportation » à chaque build TestFlight.
        ITSAppUsesNonExemptEncryption: false
        # Les sources IPTV sont souvent en http:// : on autorise toutes les connexions.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Dossier Kastideo visible dans l'app Fichiers : enregistrements et téléchargements.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Kastideo recherche les serveurs Jellyfin, Emby et Plex de votre réseau."
        NSBonjourServices:
          - _airplay._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmezes.kastideo
        PRODUCT_NAME: Kastideo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
