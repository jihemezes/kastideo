# Définition du projet Xcode (générée par XcodeGen : `xcodegen generate`).
# Le fichier Kastideo.xcodeproj n'est pas versionné : il est recréé à partir de ce fichier.
name: Kastideo

options:
  bundleIdPrefix: fr.jmezes
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Laissé vide : renseigné par la CI (secret APPLE_TEAM_ID) ou par Xcode en local.
    DEVELOPMENT_TEAM: ""

packages:
  KastideoCore:
    path: Packages/KastideoCore
  # Moteur de lecture VLC (VLCKit 3.6, LGPL) : direct MPEG-TS, HLS, MKV, AVI…
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: "3.6.0"
  # Mises à jour automatiques (https://sparkle-project.org)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  Kastideo:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: docs/AIDE.md
        buildPhase: resources
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: KastideoCore
      - package: Sparkle
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Kastideo
        CFBundleDisplayName: Kastideo
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Jean-Michel Ezes"
        # Les sources IPTV sont souvent en http:// : on autorise toutes les connexions.
        # Attention : ne pas ajouter NSAllowsArbitraryLoadsForMedia, sinon macOS ignore NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Sparkle : flux des versions (branche « appcast » du dépôt public) et clé publique EdDSA.
        SUFeedURL: https://raw.githubusercontent.com/jihemezes/kastideo/appcast/appcast.xml
        SUPublicEDKey: PhRxsgR0m+ocj9knZzFOQUMTl36+TfzEZ1MyRKxgtPQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    entitlements:
      path: App/Kastideo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Lecture des playlists choisies et écriture dans le dossier d'enregistrements choisi.
        com.apple.security.files.user-selected.read-write: true
        # Dossier par défaut des enregistrements : ~/Movies/Kastideo.
        com.apple.security.assets.movies.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle dans le bac à sable : accès au service d'installation.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - fr.jmezes.kastideo-spks
          - fr.jmezes.kastideo-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmezes.kastideo
        PRODUCT_NAME: Kastideo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          # Pas de « get-task-allow » en Release (exigé par la notarisation Apple).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme: {}
