# Publication à chaque tag vX.Y.Z (ou vX.Y.Z-betaN) : compilation, signature Developer ID, DMG,
# notarisation Apple, GitHub Release, puis mise à jour du flux Sparkle (branche « appcast »).
# Les tags -betaN sont publiés en pré-version et sur le canal Sparkle « beta ».
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   APPLE_CERTIFICATE           certificat « Developer ID Application » exporté en .p12, encodé en base64
#   APPLE_CERTIFICATE_PASSWORD  mot de passe du .p12
#   APPLE_TEAM_ID               identifiant d'équipe Apple (10 caractères)
#   APPLE_API_KEY               contenu du fichier AuthKey_XXXX.p8 (App Store Connect), en clair ou en base64
#   APPLE_API_KEY_ID            identifiant de la clé API
#   APPLE_API_ISSUER_ID         identifiant d'émetteur (Issuer ID)
#   SPARKLE_PRIVATE_KEY         clé privée EdDSA Sparkle (generate_keys -x)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: DMG signé et notarisé
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_VERSION: "2.10.0"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Ce workflow doit être lancé sur un tag vX.Y.Z (choisissez le tag dans « Use workflow from »)."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$ ]]; then
            echo "::error::Tag invalide « $GITHUB_REF_NAME » (attendu : vX.Y.Z ou vX.Y.Z-betaN)."
            exit 1
          fi
          if [[ "$VERSION" == *-beta* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
            echo "Version de test : canal Sparkle « beta », pré-version GitHub."
          else
            echo "CHANNEL=" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_PATH=$RUNNER_TEMP/Kastideo-$VERSION.dmg" >> "$GITHUB_ENV"
          echo "Version : $VERSION (build $GITHUB_RUN_NUMBER)"
          xcodebuild -version

      - name: Vérifier les secrets
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; missing=1; fi
          done
          exit $missing

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Cache des paquets Swift (VLCKit, Sparkle)
        uses: actions/cache@v4
        with:
          path: ~/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Tests du module KastideoCore
        run: swift test --package-path Packages/KastideoCore

      - name: Importer le certificat dans un trousseau temporaire
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kastideo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Autorité intermédiaire Apple « Developer ID G2 » (au cas où l'image du runner ne l'aurait pas).
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true

          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          echo "Identités de signature trouvées :"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Aucun certificat « Developer ID Application » dans APPLE_CERTIFICATE. Un certificat « Apple Distribution » ou « Apple Development » ne permet pas de publier un DMG hors App Store."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Archiver
        run: |
          if ! xcodebuild -project Kastideo.xcodeproj -scheme Kastideo -configuration Release \
                 -clonedSourcePackagesDirPath ~/spm-cache \
                 -destination 'generic/platform=macOS' \
                 -archivePath "$RUNNER_TEMP/Kastideo.xcarchive" \
                 MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
                 DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
                 CODE_SIGN_IDENTITY="$SIGN_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="" \
                 OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH" \
                 archive > archive.log 2>&1; then
            echo "::group::Erreurs"
            grep -n -i -E "error|fatal|stack dump|assertion|crash|failed with" archive.log | grep -v -E "^[0-9]+:(note|warning)|-Werror|DeveloperError" | cut -c1-600 | head -120
            echo "::endgroup::"
            tail -80 archive.log
            exit 1
          fi
          echo "Archive créée."

      - name: Exporter l'application (Developer ID)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kastideo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          APP="$RUNNER_TEMP/export/Kastideo.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|Identifier"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Créer et signer le DMG
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kastideo $VERSION" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp --keychain "$KEYCHAIN_PATH" "$DMG_PATH"

      - name: Notariser et agrafer
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEY_PATH"
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 45m --output-format json > notary.json || true
          cat notary.json
          STATUS=$(jq -r '.status // "Unknown"' notary.json)
          SUBMISSION=$(jq -r '.id // empty' notary.json)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarisation refusée ou échouée (statut : $STATUS)."
            if [ -n "$SUBMISSION" ]; then
              xcrun notarytool log "$SUBMISSION" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            fi
            rm -f "$KEY_PATH"
            exit 1
          fi
          rm -f "$KEY_PATH"
          # Agrafage du ticket : le service d'Apple (CloudKit) est parfois lent ou coupe la connexion
          # juste après l'acceptation. On réessaie ; en dernier recours on publie sans agrafe
          # (le DMG reste notarisé : macOS vérifie alors le ticket en ligne au premier lancement).
          STAPLED=0
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$DMG_PATH" && xcrun stapler validate "$DMG_PATH"; then
              STAPLED=1
              break
            fi
            echo "Agrafage impossible (tentative $attempt/6), nouvel essai dans 30 s…"
            sleep 30
          done
          if [ "$STAPLED" != "1" ]; then
            echo "::warning::Ticket de notarisation non agrafé (service Apple indisponible). Le DMG est notarisé et reste valide en ligne."
          fi
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH" || true

      - name: Signer la mise à jour pour Sparkle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]' > "$KEY_FILE"
          SIGNATURE_LINE=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$KEY_FILE" "$DMG_PATH")
          rm -f "$KEY_FILE"
          ED_SIGNATURE=$(printf '%s' "$SIGNATURE_LINE" | sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/')
          DMG_LENGTH=$(printf '%s' "$SIGNATURE_LINE" | sed -E 's/.*length="([0-9]+)".*/\1/')
          if [ -z "$ED_SIGNATURE" ] || [ "$ED_SIGNATURE" = "$SIGNATURE_LINE" ]; then
            echo "::error::Signature Sparkle impossible. Vérifiez le secret SPARKLE_PRIVATE_KEY."
            exit 1
          fi
          echo "ED_SIGNATURE=$ED_SIGNATURE" >> "$GITHUB_ENV"
          echo "DMG_LENGTH=$DMG_LENGTH" >> "$GITHUB_ENV"
          echo "Signature Sparkle OK ($DMG_LENGTH octets)."

      - name: Notes de version
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?([ ]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then echo "- Kastideo $VERSION" > "$RUNNER_TEMP/changelog.md"; fi
          cp "$RUNNER_TEMP/changelog.md" "$RUNNER_TEMP/notes.md"
          {
            echo ""
            echo "---"
            echo "**Installation** : ouvrez le fichier .dmg et glissez Kastideo dans le dossier Applications."
            echo ""
            echo "SHA-256 : \`$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')\`"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            PRERELEASE_FLAG=""
            if [ "$CHANNEL" = "beta" ]; then PRERELEASE_FLAG="--prerelease"; fi
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" $PRERELEASE_FLAG \
              --title "Kastideo $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Mettre à jour le flux Sparkle (branche appcast)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORK="$RUNNER_TEMP/appcast"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" appcast > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch appcast "$REMOTE" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init --quiet -b appcast
            git -C "$WORK" remote add origin "$REMOTE"
            printf '# Flux de mises à jour Sparkle de Kastideo\n\nBranche gérée automatiquement par le workflow Release : ne pas modifier.\n' > "$WORK/README.md"
          fi
          python3 scripts/appcast.py \
            --appcast "$WORK/appcast.xml" \
            --version "$VERSION" \
            --build "$GITHUB_RUN_NUMBER" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Kastideo-${VERSION}.dmg" \
            --length "$DMG_LENGTH" \
            --signature "$ED_SIGNATURE" \
            --notes "$RUNNER_TEMP/changelog.md" \
            --min-system "14.0" \
            ${CHANNEL:+--channel "$CHANNEL"}
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Appcast : Kastideo $VERSION"
          git push --quiet origin appcast
          echo "Flux publié : https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/appcast/appcast.xml"

      - name: Conserver le DMG comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kastideo-${{ env.VERSION }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Nettoyer le trousseau
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
