# Kastideo pour Windows et Linux (dossier desktop/, Flutter + moteur mpv).
# Publication en pré-version GitHub à chaque tag vX.Y.Z-desktopN : n'interfère ni avec la version Mac
# (release.yml ignore ces tags) ni avec les mises à jour Sparkle.
#
# Paquets produits :
#   Windows x64  : Kastideo-<version>-windows-x64-setup.exe (installateur Inno Setup) et
#                  Kastideo-<version>-windows-x64.zip (dossier portable, kastideo.exe)
#   Linux x64    : .deb pour Zorin OS 17 / Ubuntu 22.04 (libmpv1), .deb pour Zorin OS 18 / Ubuntu 24.04 (libmpv2),
#                  AppImage (toutes distributions, moteur mpv inclus)
#   Linux ARM64  : AppImage (Raspberry Pi 4/5 sous un système 64 bits) et .deb Ubuntu 22.04 ARM
#   macOS 12+    : Kastideo-Compat-<version>-macos.dmg (Intel + Apple Silicon, signé Developer ID et notarisé) pour les
#                  Mac qui ne peuvent pas installer la version native (macOS 14 Sonoma minimum)
name: Desktop

on:
  push:
    tags: ['v*-desktop*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v0.0.0-desktop0"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          N="${VERSION##*-desktop}"; [[ "$N" =~ ^[0-9]+$ ]] || N=0
          echo "numeric=${VERSION%%-*}.$N" >> "$GITHUB_OUTPUT"
      - name: Dépendances et tests
        shell: bash
        run: |
          flutter pub get
          flutter test
      - name: Construction
        shell: bash
        run: |
          flutter build windows --release \
            --build-name "${{ steps.version.outputs.name }}" --build-number "${{ github.run_number }}" \
            --dart-define=KASTIDEO_VERSION="${{ steps.version.outputs.version }}"
      - name: ffmpeg (Cast)
        continue-on-error: true
        shell: pwsh
        run: |
          # ffmpeg convertit la vidéo envoyée au téléviseur (Cast). Facultatif : sans lui, le Cast demande de l'installer.
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $bin = Get-ChildItem -Recurse ffmpeg-tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName "build/windows/x64/runner/Release/"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "build/windows/x64/runner/Release/"
      - name: Archive portable
        shell: pwsh
        run: |
          $out = "Kastideo-${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$out" | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" "dist/$out/"
          Compress-Archive -Path "dist/$out" -DestinationPath "dist/$out.zip" -Force
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DNumericVersion=${{ steps.version.outputs.numeric }}" "packaging\windows\kastideo.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            desktop/dist/*.zip
            desktop/dist/*-setup.exe

  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.distro }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            distro: ubuntu22.04
            deb_arch: amd64
            tool_arch: x86_64
            libmpv: libmpv1
            appimage: true
          - arch: x64
            runner: ubuntu-24.04
            distro: ubuntu24.04
            deb_arch: amd64
            tool_arch: x86_64
            libmpv: libmpv2
            appimage: false
          - arch: arm64
            runner: ubuntu-22.04-arm
            distro: ubuntu22.04
            deb_arch: arm64
            tool_arch: aarch64
            libmpv: libmpv1
            appimage: true
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev mpv libsecret-1-dev libnotify-dev libfuse2 file desktop-file-utils
      - name: Flutter (${{ matrix.arch }})
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - name: Version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v0.0.0-desktop0"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
      - name: Dépendances et tests
        run: |
          flutter config --no-analytics --enable-linux-desktop
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Construction
        run: |
          flutter build linux --release \
            --build-name "${{ steps.version.outputs.name }}" --build-number "${{ github.run_number }}" \
            --dart-define=KASTIDEO_VERSION="${{ steps.version.outputs.version }}"
      - name: Paquet .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE=$(ls -d build/linux/*/release/bundle)
          PKG="dist/deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/kastideo" "$PKG/usr/bin" "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/. "$PKG/opt/kastideo/"
          ln -s /opt/kastideo/kastideo "$PKG/usr/bin/kastideo"
          cp packaging/linux/kastideo.desktop "$PKG/usr/share/applications/fr.jmezes.kastideo.desktop"
          cp packaging/linux/kastideo.png "$PKG/usr/share/icons/hicolor/256x256/apps/fr.jmezes.kastideo.png"
          SIZE=$(du -sk "$PKG" | cut -f1)
          sed -e "s/@VERSION@/${VERSION//-/\~}/" -e "s/@ARCH@/${{ matrix.deb_arch }}/" -e "s/@SIZE@/$SIZE/" \
              -e "s/@LIBMPV@/${{ matrix.libmpv }}/" packaging/linux/control > "$PKG/DEBIAN/control"
          cat "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG" "dist/kastideo_${VERSION}_${{ matrix.distro }}_${{ matrix.deb_arch }}.deb"
      - name: AppImage
        if: matrix.appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.tool_arch }}"
          BUNDLE=$(ls -d build/linux/*/release/bundle)
          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$ARCH.AppImage"
          chmod +x linuxdeploy
          APPDIR="dist/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"
          # ffmpeg statique pour le Cast (facultatif : sans lui, le Cast demande de l'installer).
          case "$ARCH" in x86_64) FF=amd64;; *) FF=arm64;; esac
          if curl -fsSL -o ffmpeg.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-$FF-static.tar.xz"; then
            mkdir -p ffmpeg-tmp && tar -xJf ffmpeg.tar.xz -C ffmpeg-tmp --strip-components=1 \
              && cp ffmpeg-tmp/ffmpeg ffmpeg-tmp/ffprobe "$APPDIR/usr/bin/" || echo "ffmpeg non embarqué"
          else
            echo "ffmpeg non embarqué (téléchargement impossible)"
          fi
          LIBMPV=$(ldconfig -p | grep -m1 -E 'libmpv\.so\.[0-9]' | awk '{print $NF}')
          echo "libmpv : $LIBMPV"
          export LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          ./linuxdeploy --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/kastideo" \
            --library "$LIBMPV" \
            --desktop-file packaging/linux/kastideo.desktop \
            --icon-file packaging/linux/kastideo.png \
            --icon-filename fr.jmezes.kastideo \
            --output appimage
          mv Kastideo-*.AppImage "dist/Kastideo-${VERSION}-linux-$ARCH.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.distro }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage

  macos:
    name: macOS (Flutter, Intel + Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 75
    # Nouvelle cible : un échec ici ne bloque pas la publication des paquets Windows et Linux.
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v0.0.0-desktop0"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
      - name: Dépendances et tests
        run: |
          flutter pub get
          flutter test
      - name: Construction (macOS 12 et suivants, Intel et Apple Silicon)
        run: |
          flutter build macos --release \
            --build-name "${{ steps.version.outputs.name }}" --build-number "${{ github.run_number }}" \
            --dart-define=KASTIDEO_VERSION="${{ steps.version.outputs.version }}"
          ls -la build/macos/Build/Products/Release
      - name: Importer le certificat Developer ID
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kastideo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then echo "::error::Aucun certificat « Developer ID Application » dans APPLE_CERTIFICATE."; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Signer l'application (runtime renforcé)
        run: |
          APP="$PWD/build/macos/Build/Products/Release/Kastideo Compat.app"
          SIGN=(codesign --force --timestamp --options runtime --keychain "$KEYCHAIN_PATH" --sign "$SIGN_IDENTITY")
          # De l'intérieur vers l'extérieur : bibliothèques, puis frameworks, puis l'application.
          find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | xargs -0 -n1 "${SIGN[@]}"
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 | xargs -0 -n1 "${SIGN[@]}"
          "${SIGN[@]}" --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|Identifier"
          lipo -archs "$APP/Contents/MacOS/Kastideo Compat" || true
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: DMG
        run: |
          V="${{ steps.version.outputs.name }}"
          DMG="$RUNNER_TEMP/Kastideo-Compat-$V-macos.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" dist
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kastideo Compat $V" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp --keychain "$KEYCHAIN_PATH" "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
      - name: Notariser et agrafer
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEY_PATH"
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 45m --output-format json > notary.json || true
          cat notary.json
          STATUS=$(jq -r '.status // "Unknown"' notary.json)
          SUBMISSION=$(jq -r '.id // empty' notary.json)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarisation refusée ou échouée (statut : $STATUS)."
            if [ -n "$SUBMISSION" ]; then
              xcrun notarytool log "$SUBMISSION" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            fi
            rm -f "$KEY_PATH"
            exit 1
          fi
          rm -f "$KEY_PATH"
          STAPLED=0
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$DMG_PATH" && xcrun stapler validate "$DMG_PATH"; then STAPLED=1; break; fi
            echo "Agrafage impossible (tentative $attempt/6), nouvel essai dans 30 s…"
            sleep 30
          done
          if [ "$STAPLED" != "1" ]; then
            echo "::warning::Ticket de notarisation non agrafé (service Apple indisponible). Le DMG reste notarisé."
          fi
          cp "$DMG_PATH" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-compat
          path: desktop/dist/*.dmg

  publish:
    name: Pré-version GitHub
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Notes de version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' desktop/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Kastideo $VERSION pour Windows, Linux et Mac (compatibilité macOS 12+) (pré-version)." > notes.md
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Kastideo ${{ github.ref_name }} — Windows / Linux / Mac compatibilité (aperçu)
          body_path: notes.md
          prerelease: true
          files: artifacts/*
